version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: rag_mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-ecommerce123}
      MYSQL_DATABASE: rag_knowledge_base
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: rag_redis
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  milvus:
    image: milvusdb/milvus:v2.4.13
    container_name: rag_milvus
    command: [ "milvus", "run", "standalone" ]
    ports:
      - "19530:19530"
      - "19091:9091"
    volumes:
      - milvus_data:/var/lib/milvus
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    depends_on:
      - etcd
      - minio
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9091/api/v1/health" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: rag_etcd
    command: etcd -listen-client-urls http://0.0.0.0:2379 -advertise-client-urls http://0.0.0.0:2379
    volumes:
      - etcd_data:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 10s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: rag_minio
    command: minio server /data
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 5

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
    container_name: rag_app
    ports:
      - "8000:8000"
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-ecommerce123}
      MYSQL_DATABASE: rag_knowledge_base

      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0

      MILVUS_HOST: milvus
      MILVUS_PORT: 19530
      MILVUS_COLLECTION: cloudDesk_documents
      MILVUS_WEIGHT: 0.5

      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}

      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-Pro/BAAI/bge-m3}
      EMBEDDING_DEVICE: ${EMBEDDING_DEVICE:-cpu}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-1024}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-https://api.siliconflow.cn/v1}

      RERANKER_DEVICE: ${RERANKER_DEVICE:-cuda}

volumes:
  mysql_data:
  redis_data:
  milvus_data:
  etcd_data:
  minio_data:
